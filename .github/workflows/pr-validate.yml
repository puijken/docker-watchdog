name: Validate PR Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Required for `load: true` to export the built image into the local docker daemon.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # load: true puts the image into the local daemon so the smoke test can run it.
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: docker-watchdog:pr

      # Building proves nothing about runtime: a base-image or Flask bump still builds cleanly
      # while the proxy fails to start, the bundled docker CLI stops talking to the daemon, or the
      # watchdog never stops anything. This runs one full on-demand cycle against the real daemon.
      - name: Smoke test
        run: |
          python3 smoke_test.py docker-watchdog:pr
